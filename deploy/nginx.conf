# Конфиг для сайта ART.OHREY.
# После установки: sudo cp deploy/nginx.conf /etc/nginx/sites-available/art-ohrey
#                   sudo ln -s /etc/nginx/sites-available/art-ohrey /etc/nginx/sites-enabled/
#                   sudo certbot --nginx -d art-ohrey.art -d www.art-ohrey.art
# certbot сам допишет сюда блоки для HTTPS и редиректа с http на https.

server {
    listen 80;
    listen [::]:80;
    server_name art-ohrey.art www.art-ohrey.art;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
